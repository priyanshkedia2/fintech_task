<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PCR Strategy Dashboard</title><style>body{margin:0;background:#080e1b;color:#edf2ff;font-family:Segoe UI,Arial}.head{padding:18px 22px 10px}.head h1{margin:0;font-size:24px}.sub{color:#9fb0cf;font-size:13px;margin-top:4px}.nav{display:flex;gap:8px;padding:0 22px 12px}.nav button{background:#121a2e;color:#9fb0cf;border:1px solid #273553;border-radius:9px;padding:9px 15px;cursor:pointer;font-weight:600}.nav button.active{background:#213252;color:#fff;border-color:#41649c}iframe{display:block;border:0;width:100%;height:calc(100vh - 104px);background:#0b1020}</style></head><body><div class="head"><h1>PCR Strategy Dashboard</h1><div class="sub">Performance • PCR Ranks • Individual Trade Logs</div></div><div class="nav"><button class="active" data-src="./pcr-dashboard/">Performance</button><button data-src="./pcr-dashboard/ranks.html">PCR Ranks</button><button data-src="./pcr-dashboard/trades.html">Trade Logs</button></div><iframe id="view" src="./pcr-dashboard/"></iframe><script>const view=document.getElementById('view');document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.nav button').forEach(x=>x.classList.remove('active'));b.classList.add('active');view.src=b.dataset.src});function fmtDate(v,withTime=false){if(!v)return'';if(/^\d{2}\/\d{2}\/\d{4}/.test(v))return v;const s=String(v).trim(),date=s.slice(0,10).split('-');if(date.length!==3)return v;let out=`${date[2]}/${date[1]}/${date[0]}`;if(withTime&&s.length>10){const t=s.slice(11,19);if(t)out+=' '+t}return out}function fmtNum(v){if(v===null||v===undefined||String(v).trim()==='')return'';const n=Number(v);return Number.isFinite(n)?n.toLocaleString('en-US',{maximumFractionDigits:2,useGrouping:false}):v}function setCell(c,v){if(c.textContent.trim()!==String(v))c.textContent=v}function formatChild(){let doc;try{doc=view.contentDocument}catch(e){return}if(!doc)return;const src=view.getAttribute('src')||'';const isRanks=src.includes('ranks.html'),isTrades=src.includes('trades.html');if(!isRanks&&!isTrades)return;doc.querySelectorAll('table').forEach(t=>{const heads=[...t.querySelectorAll('thead th')].map(x=>x.textContent.trim());t.querySelectorAll('tbody tr').forEach(r=>{[...r.cells].forEach((c,i)=>{const k=heads[i]||'',v=c.textContent.trim();if(isRanks){if(['pcr_date','trade_date','nearest_expiry','monthly_expiry'].includes(k))setCell(c,fmtDate(v));else if(['pcr','weighted_pcr','pcr_rank','weighted_pcr_rank','dte'].includes(k))setCell(c,fmtNum(v))}else{if(['pcr_date','trade_date'].includes(k))setCell(c,fmtDate(v));else if(['entry_timestamp','exit_timestamp'].includes(k))setCell(c,fmtDate(v,true));else if(!['symbol','exit_reason'].includes(k))setCell(c,fmtNum(v))}})})});if(isRanks){const ds=doc.getElementById('date');if(ds)[...ds.options].forEach(o=>{if(o.value){const x=fmtDate(o.value);if(o.textContent!==x)o.textContent=x}})}}view.addEventListener('load',()=>{formatChild();try{new MutationObserver(formatChild).observe(view.contentDocument.body,{childList:true,subtree:true})}catch(e){}});</script></body></html>
