<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VGRSI Performance</title>
<style>:root{--bg:#0b1020;--panel:#121a2e;--panel2:#18223a;--text:#edf2ff;--muted:#9fb0cf;--border:#273553;--good:#4ade80;--purple:#c084fc}*{box-sizing:border-box}body{margin:0;background:#0b1020;color:var(--text);font-family:Segoe UI,Arial;padding:24px}.sub{color:var(--muted);margin:4px 0 20px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.card{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:15px}.lab{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.07em}.val{font-size:23px;font-weight:700;margin-top:6px}.controls{margin:16px 0}select{background:var(--panel);color:var(--text);border:1px solid var(--border);border-radius:8px;padding:9px 12px}.section{margin-top:20px}.section h3{margin:0 0 10px}table{width:100%;border-collapse:collapse;font-size:13px}th,td{padding:10px;border-bottom:1px solid var(--border);text-align:right}th:first-child,td:first-child{text-align:left}th{background:var(--panel2);color:#bfd0ec}.note{color:var(--muted);font-size:12px;margin-top:10px}@media(max-width:850px){.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:500px){.grid{grid-template-columns:1fr}}</style></head><body>
<h2>VGRSI Performance</h2><div class="sub">Current Week + Monthly Expiry PCR only • Lowest 10 PCR ranks • A1 trigger + A0 confirmation • SL/TP 5%</div>
<div class="controls">Threshold&nbsp;<select id="th"><option value="30">30</option><option value="40" selected>40</option></select></div>
<div class="grid" id="kpis"></div>
<div class="section card"><h3>Threshold Comparison</h3><table id="tbl"></table><div class="note">Both VGRSI runs use only Current Week + Monthly PCR and fixed 5% stop-loss / 5% take-profit.</div></div>
<script>
const D={"30":{"win_rate":55.33,"sharpe":2.152,"net_pnl":1105,"max_drawdown":425,"avg_capital":3691,"max_capital":11037,"profit_factor":1.385},"40":{"win_rate":55.10,"sharpe":2.189,"net_pnl":2872,"max_drawdown":1093,"avg_capital":12995,"max_capital":26929,"profit_factor":1.306}};
const fields=[["win_rate","Win Rate"],["sharpe","Sharpe"],["net_pnl","Net P&L"],["max_drawdown","Max Drawdown"],["avg_capital","Avg Capital"],["max_capital","Max Capital"],["profit_factor","Profit Factor"]];
function f(k,v){if(k==="win_rate")return v.toFixed(2)+"%";if(k==="sharpe"||k==="profit_factor")return v.toFixed(3);return "$"+Math.round(v).toLocaleString()}
function draw(){const r=D[th.value];kpis.innerHTML=fields.map(([k,l])=>`<div class="card"><div class="lab">${l}</div><div class="val">${f(k,r[k])}</div></div>`).join("")+`<div class="card"><div class="lab">Configuration</div><div class="val" style="font-size:17px">Threshold ${th.value}</div><div class="note">SL/TP 5% • Week + Monthly</div></div>`}
function table(){let h="<thead><tr><th>Threshold</th>"+fields.map(x=>`<th>${x[1]}</th>`).join("")+"</tr></thead><tbody>";Object.entries(D).forEach(([t,r])=>{h+=`<tr><td>${t}</td>`+fields.map(([k])=>`<td>${f(k,r[k])}</td>`).join("")+"</tr>"});tbl.innerHTML=h+"</tbody>"}th.onchange=draw;table();draw();
</script></body></html>
