<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PCR Ranks</title><script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script><style>body{margin:0;font-family:Segoe UI,Arial;background:#0b1020;color:#edf2ff;padding:22px}h2{margin:0 0 5px}.muted{color:#9fb0cf}.controls{display:flex;gap:10px;flex-wrap:wrap;align-items:end;margin:18px 0}label{font-size:12px;color:#9fb0cf}select,input,a{display:block;margin-top:5px;background:#121a2e;color:#edf2ff;border:1px solid #273553;border-radius:8px;padding:9px;text-decoration:none}.wrap{overflow:auto;max-height:720px;border:1px solid #273553;border-radius:10px}table{border-collapse:collapse;width:100%;font-size:12px}th,td{padding:8px;border-bottom:1px solid #273553;white-space:nowrap;text-align:right}th:first-child,td:first-child{text-align:left}th{position:sticky;top:0;background:#18223a;color:#bfd0ec}.top10 td{background:rgba(74,222,128,.10)}.pager{display:flex;gap:8px;align-items:center;margin-top:10px}button{background:#121a2e;color:#edf2ff;border:1px solid #273553;border-radius:8px;padding:8px 12px}.status{color:#9fb0cf;margin:8px 0}</style></head><body><h2>PCR Ranks</h2><div class="muted">Full daily PCR ranking universe. Rank 1–10 is highlighted.</div><div class="controls"><label>Mode<select id="mode"><option value="nearest">Nearest Expiry</option><option value="weekly">Week + Monthly</option></select></label><label>Trade date<select id="date"></select></label><label>Ticker<input id="ticker" placeholder="AAPL"></label><label>Max rank<input id="maxrank" type="number" value="200" min="1" style="width:85px"></label><a id="download" download>Download source CSV</a></div><div id="status" class="status">Loading…</div><div class="wrap"><table id="table"></table></div><div class="pager"><button id="prev">Previous</button><span id="page" class="muted"></span><button id="next">Next</button></div><script>const F={nearest:"../data/pcr_atm_otm_NEAREST_EXPIRY_SPLIT_CORRECTED_ranks_2025-08-06_to_2026-08-06.csv",weekly:"../data/pcr_atm_otm_CURRENT_WEEK_PLUS_MONTHLY_SPLIT_CORRECTED_WEIGHTED_ranks_2025-08-06_to_2026-08-06.csv"},P=100;let all=[],filtered=[],pg=0;function e(x){return String(x??"").replace(/[&<>]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[m]))}function load(){const m=mode.value,u=F[m];status.textContent="Loading rank data…";download.href=u;Papa.parse(u,{download:true,header:true,skipEmptyLines:true,complete:r=>{all=r.data;const ds=[...new Set(all.map(x=>x.trade_date).filter(Boolean))].sort();date.innerHTML=ds.map(x=>`<option>${x}</option>`).join("");if(ds.length)date.value=ds[ds.length-1];status.textContent=`Loaded ${all.length.toLocaleString()} rows.`;filter()},error:()=>status.textContent="Data file is not yet present in the repository /data folder."})}function filter(){const m=mode.value,rc=m==="nearest"?"pcr_rank":"weighted_pcr_rank",d=date.value,t=ticker.value.trim().toUpperCase(),mx=+(maxrank.value||9999);filtered=all.filter(x=>(!d||x.trade_date===d)&&(!t||String(x.symbol).toUpperCase().includes(t))&&(+x[rc]<=mx)).sort((a,b)=>+a[rc]-+b[rc]);pg=0;render()}function render(){const m=mode.value,rc=m==="nearest"?"pcr_rank":"weighted_pcr_rank",pc=m==="nearest"?"pcr":"weighted_pcr",cols=m==="nearest"?["pcr_date","trade_date","symbol",pc,rc,"nearest_expiry","dte"]:["pcr_date","trade_date","symbol",pc,rc,"monthly_expiry","selected_expiries"],rows=filtered.slice(pg*P,(pg+1)*P);table.innerHTML="<thead><tr>"+cols.map(c=>`<th>${e(c)}</th>`).join("")+"</tr></thead><tbody>"+rows.map(r=>`<tr class="${+r[rc]<=10?"top10":""}">`+cols.map(c=>`<td>${e(r[c])}</td>`).join("")+"</tr>").join("")+"</tbody>";const pages=Math.max(1,Math.ceil(filtered.length/P));page.textContent=`${filtered.length.toLocaleString()} rows • page ${pg+1}/${pages}`;prev.disabled=pg===0;next.disabled=pg>=pages-1}mode.onchange=load;date.onchange=filter;ticker.oninput=filter;maxrank.oninput=filter;prev.onclick=()=>{if(pg){pg--;render()}};next.onclick=()=>{if((pg+1)*P<filtered.length){pg++;render()}};load();</script></body></html>
