<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Trade Logs</title><script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script><style>body{margin:0;font-family:Segoe UI,Arial;background:#0b1020;color:#edf2ff;padding:22px}h2{margin:0 0 5px}.muted{color:#9fb0cf}.controls{display:flex;gap:10px;flex-wrap:wrap;align-items:end;margin:18px 0}label{font-size:12px;color:#9fb0cf}select,input,a,button{display:block;margin-top:5px;background:#121a2e;color:#edf2ff;border:1px solid #273553;border-radius:8px;padding:9px;text-decoration:none}.wrap{overflow:auto;max-height:720px;border:1px solid #273553;border-radius:10px}table{border-collapse:collapse;width:100%;font-size:12px}th,td{padding:8px;border-bottom:1px solid #273553;white-space:nowrap;text-align:right}th:first-child,td:first-child{text-align:left}th{position:sticky;top:0;background:#18223a;color:#bfd0ec}.pos{color:#67e8a0}.neg{color:#fb8b9a}.pager{display:flex;gap:8px;align-items:center;margin-top:10px}.status{color:#9fb0cf;margin:8px 0}</style></head><body><h2>Trade Logs</h2><div class="muted">Individual trades for all 14 Nearest / Week + Monthly SL/TP runs.</div><div class="controls"><label>Mode<select id="mode"><option value="nearest">Nearest Expiry</option><option value="weekly">Week + Monthly</option></select></label><label>SL/TP<select id="sl"></select></label><label>Trade date<input id="date" type="date"></label><label>Ticker<input id="ticker" placeholder="NVDA"></label><label>Exit reason<select id="reason"><option value="">All</option></select></label><button id="clear">Clear filters</button><a id="download" download>Download selected CSV</a></div><div id="status" class="status">Loading…</div><div class="wrap"><table id="table"></table></div><div class="pager"><button id="prev">Previous</button><span id="page" class="muted"></span><button id="next">Next</button></div><script>const S=[2,2.5,3,3.5,4,4.5,5],P=100,F={nearest:{"2":"pcr_nearest_low10_rsi14_cross_mean70_sl2_tp2_weekly_hold_trade_log.csv","2.5":"pcr_nearest_low10_rsi14_cross_mean70_sl2p5_tp2p5_weekly_hold_trade_log.csv","3":"pcr_nearest_low10_rsi14_cross_mean70_sl3_tp3_weekly_hold_trade_log.csv","3.5":"pcr_nearest_low10_rsi14_cross_mean70_sl3p5_tp3p5_weekly_hold_trade_log.csv","4":"pcr_nearest_low10_rsi14_cross_mean70_sl4_tp4_weekly_hold_trade_log.csv","4.5":"pcr_nearest_low10_rsi14_cross_mean70_sl4p5_tp4p5_weekly_hold_trade_log.csv","5":"pcr_nearest_low10_rsi14_cross_mean70_sl5_tp5_weekly_hold_trade_log.csv"},weekly:{"2":"pcr_weekly_monthly_low10_rsi14_cross_mean70_sl2_tp2_weekly_hold_trade_log.csv","2.5":"pcr_weekly_monthly_low10_rsi14_cross_mean70_sl2p5_tp2p5_weekly_hold_trade_log.csv","3":"pcr_weekly_monthly_low10_rsi14_cross_mean70_sl3_tp3_weekly_hold_trade_log.csv","3.5":"pcr_weekly_monthly_low10_rsi14_cross_mean70_sl3p5_tp3p5_weekly_hold_trade_log.csv","4":"pcr_weekly_monthly_low10_rsi14_cross_mean70_sl4_tp4_weekly_hold_trade_log.csv","4.5":"pcr_weekly_monthly_low10_rsi14_cross_mean70_sl4p5_tp4p5_weekly_hold_trade_log.csv","5":"pcr_weekly_monthly_low10_rsi14_cross_mean70_sl5_tp5_weekly_hold_trade_log.csv"}};let all=[],filtered=[],pg=0;S.forEach(v=>{const o=document.createElement("option");o.value=v;o.textContent=v+"%";if(v===5)o.selected=true;sl.appendChild(o)});function e(x){return String(x??"").replace(/[&<>]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[m]))}function url(){return"../data/"+F[mode.value][sl.value]}function load(){const u=url();download.href=u;status.textContent="Loading trade log…";Papa.parse(u,{download:true,header:true,skipEmptyLines:true,complete:r=>{all=r.data;const rs=[...new Set(all.map(x=>x.exit_reason).filter(Boolean))].sort();reason.innerHTML='<option value="">All</option>'+rs.map(x=>`<option>${e(x)}</option>`).join("");status.textContent=`Loaded ${all.length.toLocaleString()} trades.`;filter()},error:()=>status.textContent="Trade-log file is not yet present in the repository /data folder."})}function filter(){const d=date.value,t=ticker.value.trim().toUpperCase(),q=reason.value;filtered=all.filter(x=>(!d||x.trade_date===d)&&(!t||String(x.symbol).toUpperCase().includes(t))&&(!q||x.exit_reason===q));pg=0;render()}function render(){const cols=["symbol","pcr_date","trade_date","pcr_value","pcr_rank","entry_timestamp","entry_price","rsi14","rsi14_mean100","quantity","capital_used","stop_loss_price","take_profit_price","exit_timestamp","exit_price","exit_reason","gross_pnl","pnl_pct"],rows=filtered.slice(pg*P,(pg+1)*P);table.innerHTML="<thead><tr>"+cols.map(c=>`<th>${e(c)}</th>`).join("")+"</tr></thead><tbody>"+rows.map(r=>"<tr>"+cols.map(c=>`<td class="${c==="gross_pnl"?(+r[c]>=0?"pos":"neg"):""}">${e(r[c])}</td>`).join("")+"</tr>").join("")+"</tbody>";const pages=Math.max(1,Math.ceil(filtered.length/P));page.textContent=`${filtered.length.toLocaleString()} trades • page ${pg+1}/${pages}`;prev.disabled=pg===0;next.disabled=pg>=pages-1}mode.onchange=load;sl.onchange=load;date.onchange=filter;ticker.oninput=filter;reason.onchange=filter;clear.onclick=()=>{date.value="";ticker.value="";reason.value="";filter()};prev.onclick=()=>{if(pg){pg--;render()}};next.onclick=()=>{if((pg+1)*P<filtered.length){pg++;render()}};load();</script></body></html>
