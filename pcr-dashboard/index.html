<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PCR Strategy Dashboard</title>
<style>
:root {--bg:#0b1020;--panel:#121a2e;--panel2:#18223a;--text:#edf2ff;--muted:#9fb0cf;--accent:#6ea8fe;--good:#4ade80;--bad:#fb7185;--border:#273553}
*{box-sizing:border-box}body{margin:0;font-family:Inter,Segoe UI,Arial,sans-serif;background:linear-gradient(180deg,#09101f,#0d1425 45%,#0b1020);color:var(--text)}.wrap{max-width:1440px;margin:auto;padding:28px}h1{font-size:30px;margin:0 0 6px}.sub{color:var(--muted);margin-bottom:24px}.controls{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:20px}select{background:var(--panel);color:var(--text);border:1px solid var(--border);border-radius:10px;padding:10px 12px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.card{background:rgba(18,26,46,.95);border:1px solid var(--border);border-radius:14px;padding:16px;box-shadow:0 8px 22px rgba(0,0,0,.15)}.kpi-label{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}.kpi-value{font-size:25px;font-weight:700;margin-top:7px}.section{margin-top:22px}.section h2{font-size:18px;margin:0 0 12px}.compare{display:grid;grid-template-columns:1fr 1fr;gap:14px}.chart{height:290px;position:relative}svg{width:100%;height:100%;overflow:visible}.legend{display:flex;gap:18px;color:var(--muted);font-size:12px;margin-bottom:8px}.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px}table{width:100%;border-collapse:collapse;font-size:13px}th,td{padding:10px;border-bottom:1px solid var(--border);text-align:right;white-space:nowrap}th:first-child,td:first-child{text-align:left}th{color:var(--muted);font-weight:600;background:var(--panel2);position:sticky;top:0}tr:hover td{background:#17213a}.badge{padding:4px 8px;border-radius:999px;background:#1d2a47;color:#bcd0f7;font-size:12px}.footer{color:var(--muted);font-size:12px;margin-top:16px}@media(max-width:900px){.grid{grid-template-columns:repeat(2,1fr)}.compare{grid-template-columns:1fr}}@media(max-width:560px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap"><h1>PCR Strategy Backtest Dashboard</h1><div class="sub">ATM + OTM PCR • Nearest Expiry vs Current Week + Monthly Expiry • Summary results</div><div class="controls"><label>SL/TP&nbsp;<select id="slSelect"></select></label><label>Primary strategy&nbsp;<select id="strategySelect"><option>Week + Monthly</option><option>Nearest Expiry</option></select></label><label>Chart metric&nbsp;<select id="metricSelect"><option value="net_pnl">Net P&L</option><option value="sharpe">Sharpe</option><option value="win_rate">Win Rate</option><option value="max_drawdown">Max Drawdown</option><option value="avg_daily_capital">Avg Daily Capital</option><option value="max_capital">Max Capital</option><option value="profit_factor">Profit Factor</option></select></label></div><div class="grid" id="kpis"></div><div class="section compare"><div class="card"><h2 id="chartTitle">Metric by SL/TP</h2><div class="legend"><span><i class="dot" style="background:#6ea8fe"></i>Week + Monthly</span><span><i class="dot" style="background:#f59e0b"></i>Nearest Expiry</span></div><div class="chart"><svg id="lineChart"></svg></div></div><div class="card"><h2>Selected SL/TP Comparison</h2><div class="chart"><svg id="barChart"></svg></div></div></div><div class="section card"><h2>All Results</h2><div style="overflow:auto"><table id="resultsTable"></table></div></div><div class="footer">Source: curr_week+monthly_expiry_prev_day_pcr.xlsx and nearest_expiry_prev_day_pcr.xlsx</div></div>
<script>
const DATA={"Week + Monthly":[{"sl_tp":2.0,"win_rate":52.48,"sharpe":1.26,"net_pnl":1566,"max_drawdown":1218,"avg_daily_capital":13800,"max_capital":22000,"profit_factor":1.09},{"sl_tp":2.5,"win_rate":52.51,"sharpe":1.76,"net_pnl":2498,"max_drawdown":1449,"avg_daily_capital":15000,"max_capital":23500,"profit_factor":1.16},{"sl_tp":3.0,"win_rate":52.92,"sharpe":1.9,"net_pnl":2819,"max_drawdown":1640,"avg_daily_capital":16000,"max_capital":27500,"profit_factor":1.18},{"sl_tp":3.5,"win_rate":52.71,"sharpe":1.78,"net_pnl":2789,"max_drawdown":1652,"avg_daily_capital":17000,"max_capital":28500,"profit_factor":1.185},{"sl_tp":4.0,"win_rate":53.03,"sharpe":1.81,"net_pnl":3145,"max_drawdown":1701,"avg_daily_capital":18000,"max_capital":29500,"profit_factor":1.21},{"sl_tp":4.5,"win_rate":52.99,"sharpe":1.9,"net_pnl":3415,"max_drawdown":1646,"avg_daily_capital":18000,"max_capital":31500,"profit_factor":1.23},{"sl_tp":5.0,"win_rate":53.42,"sharpe":2.02,"net_pnl":3536,"max_drawdown":1701,"avg_daily_capital":18500,"max_capital":32500,"profit_factor":1.25}],"Nearest Expiry":[{"sl_tp":2.0,"win_rate":52.08,"sharpe":0.74,"net_pnl":773,"max_drawdown":1490,"avg_daily_capital":14000,"max_capital":22000,"profit_factor":1.04},{"sl_tp":2.5,"win_rate":52.33,"sharpe":1.21,"net_pnl":1729,"max_drawdown":1459,"avg_daily_capital":15500,"max_capital":25000,"profit_factor":1.11},{"sl_tp":3.0,"win_rate":52.88,"sharpe":1.35,"net_pnl":2068,"max_drawdown":1593,"avg_daily_capital":16400,"max_capital":28500,"profit_factor":1.13},{"sl_tp":3.5,"win_rate":52.66,"sharpe":1.53,"net_pnl":2266,"max_drawdown":1587,"avg_daily_capital":17000,"max_capital":30700,"profit_factor":1.15},{"sl_tp":4.0,"win_rate":53.14,"sharpe":1.55,"net_pnl":2688,"max_drawdown":1563,"avg_daily_capital":17900,"max_capital":32500,"profit_factor":1.18},{"sl_tp":4.5,"win_rate":53.16,"sharpe":1.56,"net_pnl":2833,"max_drawdown":1439,"avg_daily_capital":18400,"max_capital":34000,"profit_factor":1.19},{"sl_tp":5.0,"win_rate":53.28,"sharpe":1.71,"net_pnl":2869,"max_drawdown":1419,"avg_daily_capital":18700,"max_capital":34000,"profit_factor":1.2}]};
const labels={win_rate:"Win Rate",sharpe:"Sharpe",net_pnl:"Net P&L",max_drawdown:"Max Drawdown",avg_daily_capital:"Avg Daily Capital",max_capital:"Max Capital",profit_factor:"Profit Factor"};const money=new Set(["net_pnl","max_drawdown","avg_daily_capital","max_capital"]);const slSel=document.getElementById("slSelect");[2,2.5,3,3.5,4,4.5,5].forEach(v=>{let o=document.createElement("option");o.value=v;o.textContent=v+"%";if(v===5)o.selected=true;slSel.appendChild(o)});const stratSel=document.getElementById("strategySelect"),metricSel=document.getElementById("metricSelect");function fmt(k,v){if(k==="win_rate")return v.toFixed(2)+"%";if(k==="sharpe"||k==="profit_factor")return v.toFixed(3);if(money.has(k))return "$"+Math.round(v).toLocaleString();return String(v)}function selectedRow(strategy){const sl=parseFloat(slSel.value);return DATA[strategy].find(r=>r.sl_tp===sl)}function updateKPIs(){const s=stratSel.value,r=selectedRow(s),fields=[["win_rate","Win Rate"],["sharpe","Sharpe"],["net_pnl","Net P&L"],["max_drawdown","Max Drawdown"],["avg_daily_capital","Avg Daily Capital"],["max_capital","Max Capital"],["profit_factor","Profit Factor"]];document.getElementById("kpis").innerHTML=fields.map(([k,l])=>`<div class="card"><div class="kpi-label">${l}</div><div class="kpi-value">${fmt(k,r[k])}</div></div>`).join("")+`<div class="card"><div class="kpi-label">Strategy</div><div class="kpi-value" style="font-size:18px">${s}</div><div style="margin-top:7px"><span class="badge">SL/TP ${r.sl_tp}%</span></div></div>`}function drawLine(){const metric=metricSel.value,svg=document.getElementById("lineChart");document.getElementById("chartTitle").textContent=labels[metric]+" by SL/TP";const W=640,H=260,p={l:55,r:20,t:18,b:42},xs=DATA["Week + Monthly"].map(d=>d.sl_tp),vals=[...DATA["Week + Monthly"],...DATA["Nearest Expiry"]].map(d=>d[metric]);let ymin=Math.min(...vals),ymax=Math.max(...vals);if(ymin===ymax){ymin-=1;ymax+=1}const pad=(ymax-ymin)*.12;ymin-=pad;ymax+=pad;const X=x=>p.l+(x-xs[0])/(xs[xs.length-1]-xs[0])*(W-p.l-p.r),Y=y=>H-p.b-(y-ymin)/(ymax-ymin)*(H-p.t-p.b);let h=`<line x1="${p.l}" y1="${H-p.b}" x2="${W-p.r}" y2="${H-p.b}" stroke="#344361"/><line x1="${p.l}" y1="${p.t}" x2="${p.l}" y2="${H-p.b}" stroke="#344361"/>`;xs.forEach(x=>h+=`<text x="${X(x)}" y="${H-16}" text-anchor="middle" fill="#9fb0cf" font-size="11">${x}</text>`);for(let i=0;i<5;i++){let v=ymin+(ymax-ymin)*i/4,y=Y(v);h+=`<line x1="${p.l}" y1="${y}" x2="${W-p.r}" y2="${y}" stroke="#202c47"/><text x="${p.l-8}" y="${y+4}" text-anchor="end" fill="#9fb0cf" font-size="10">${money.has(metric)?"$"+Math.round(v):v.toFixed(2)}</text>`}[["Week + Monthly","#6ea8fe"],["Nearest Expiry","#f59e0b"]].forEach(([name,color])=>{const a=DATA[name],pts=a.map(d=>`${X(d.sl_tp)},${Y(d[metric])}`).join(" ");h+=`<polyline points="${pts}" fill="none" stroke="${color}" stroke-width="3"/>`;a.forEach(d=>h+=`<circle cx="${X(d.sl_tp)}" cy="${Y(d[metric])}" r="4" fill="${color}"><title>${name} | ${d.sl_tp}% | ${labels[metric]}: ${fmt(metric,d[metric])}</title></circle>`)});svg.setAttribute("viewBox",`0 0 ${W} ${H}`);svg.innerHTML=h}function drawBars(){const metric=metricSel.value,sl=parseFloat(slSel.value),svg=document.getElementById("barChart"),a=selectedRow("Week + Monthly")[metric],b=selectedRow("Nearest Expiry")[metric],W=640,H=260,max=Math.max(a,b)*1.18||1,base=220,scale=v=>(v/max)*165,bw=125,bars=[{x:125,v:a,c:"#6ea8fe",n:"Week + Monthly"},{x:385,v:b,c:"#f59e0b",n:"Nearest Expiry"}];let h=`<line x1="60" y1="${base}" x2="590" y2="${base}" stroke="#344361"/>`;bars.forEach(q=>{const hh=scale(q.v),y=base-hh;h+=`<rect x="${q.x}" y="${y}" width="${bw}" height="${hh}" rx="7" fill="${q.c}"/><text x="${q.x+bw/2}" y="${y-9}" text-anchor="middle" fill="#edf2ff" font-size="14" font-weight="700">${fmt(metric,q.v)}</text><text x="${q.x+bw/2}" y="${base+22}" text-anchor="middle" fill="#9fb0cf" font-size="11">${q.n}</text>`});h+=`<text x="320" y="250" text-anchor="middle" fill="#9fb0cf" font-size="11">SL/TP ${sl}% • ${labels[metric]}</text>`;svg.setAttribute("viewBox",`0 0 ${W} ${H}`);svg.innerHTML=h}function table(){const cols=[["Strategy","strategy"],["SL/TP","sl_tp"],["Win Rate","win_rate"],["Sharpe","sharpe"],["Net P&L","net_pnl"],["Max Drawdown","max_drawdown"],["Avg Daily Capital","avg_daily_capital"],["Max Capital","max_capital"],["Profit Factor","profit_factor"]],all=[];Object.entries(DATA).forEach(([s,rows])=>rows.forEach(r=>all.push({strategy:s,...r})));let h="<thead><tr>"+cols.map(c=>`<th>${c[0]}</th>`).join("")+"</tr></thead><tbody>";all.forEach(r=>{h+="<tr>"+cols.map(([_,k])=>`<td>${k==="strategy"?r[k]:(k==="sl_tp"?r[k]+"%":fmt(k,r[k]))}</td>`).join("")+"</tr>"});h+="</tbody>";document.getElementById("resultsTable").innerHTML=h}function update(){updateKPIs();drawLine();drawBars()}[slSel,stratSel,metricSel].forEach(el=>el.addEventListener("change",update));table();update();
</script>
</body>
</html>
